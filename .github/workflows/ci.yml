# Owned by house-template-base. The job runs `make check`, which includes every stack layer's checks
# (mk/<layer>.mk). Toolchain versions come from files the stack layers own: .python-version
# (fastapi), .node-version (nextjs).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the template-owned check compares with the base branch

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Corepack no longer ships with Node (from 25), so pnpm comes from its own action; the
      # version is the one frontend/package.json pins in "packageManager".
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Install dependencies and hooks
        run: make install

      - name: Run every check
        run: make check

      - name: Flag changes to template-owned files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/check_template_owned.py --base "origin/${BASE_REF}"
