# pnpm settings (https://pnpm.io/supply-chain-security). Install scripts run only for packages
# listed here as true: sharp and unrs-resolver ship prebuilt binaries, so neither needs one.
# pnpm also holds back versions published in the last day (minimumReleaseAge, default 1440
# minutes), and Dependabot waits seven days before proposing an update.
allowBuilds:
  sharp: false
  unrs-resolver: false

# minimatch 10.2.6 (GHSA-g3hv-75wg-m249, moderate) comes in through eslint-config-next >
# typescript-eslint > @typescript-eslint/typescript-estree. Force the patched 11.0.1 (BlueOak-1.0.0).
# Remove this when typescript-eslint moves to minimatch 11. The 3.x and 5.x copies are unaffected.
overrides:
  "minimatch@10": "11.0.1"
